name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  control:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: control/go.mod
          cache-dependency-path: control/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...

  funding_carry:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: funding_carry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: funding_carry/requirements.txt
      - run: pip install -r requirements.txt pytest==9.1.1
      - run: python -m pytest -q -p no:cacheprovider tests

  no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No env or key files are tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)(\.env(\..*)?|[^/]*\.env|env\.example|[^/]*\.key|state\.json|config\.txt)$' || true)
          if [ -n "$bad" ]; then echo "Tracked secret-like files:"; echo "$bad"; exit 1; fi
